events {
    worker_connections 2048;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=tiles:10m
                     max_size=21g inactive=12h use_temp_path=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $arg_url $titiler_hash_key {
        default $arg_url;
        "" $request_uri;
    }

    # Only public HTTPS TiTiler API responses feed the client-traffic dashboard.
    # Query strings are intentionally omitted from the JSON log to avoid recording
    # signed raster URLs and to keep tile coordinates out of Loki labels.
    map $uri $log_api_request {
        default 1;
        ~^/grafana(?:/|$) 0;
        /metrics 0;
        /healthz 0;
    }

    map $uri $api_endpoint {
        default other_api;

        ~^/cog/tiles(?:/|$) "/cog/tiles/{tileMatrixSetId}/{z}/{x}/{y}";
        ~^/cog/[^/]+/tilejson\.json$ "/cog/{tileMatrixSetId}/tilejson.json";
        ~^/cog/info(?:\.geojson)?$ "/cog/info";
        ~^/cog/statistics$ "/cog/statistics";
        ~^/cog/point/ "/cog/point/{lon},{lat}";
        ~^/cog/preview "/cog/preview";
        ~^/cog/bbox/ "/cog/bbox";
        ~^/cog/feature "/cog/feature";
        ~^/cog/validate$ "/cog/validate";
        ~^/cog/(?:map|viewer)$ "/cog/map-or-viewer";

        ~^/stac/tiles(?:/|$) "/stac/tiles/{tileMatrixSetId}/{z}/{x}/{y}";
        ~^/stac/[^/]+/tilejson\.json$ "/stac/{tileMatrixSetId}/tilejson.json";
        ~^/stac/info(?:\.geojson)?$ "/stac/info";
        ~^/stac/statistics$ "/stac/statistics";
        ~^/stac/point/ "/stac/point/{lon},{lat}";
        ~^/stac/preview "/stac/preview";
        ~^/stac/bbox/ "/stac/bbox";
        ~^/stac/feature "/stac/feature";
        ~^/stac/(?:map|viewer)$ "/stac/map-or-viewer";

        ~^/mosaicjson/tiles(?:/|$) "/mosaicjson/tiles/{tileMatrixSetId}/{z}/{x}/{y}";
        ~^/mosaicjson/[^/]+/tilejson\.json$ "/mosaicjson/{tileMatrixSetId}/tilejson.json";
        ~^/mosaicjson/info(?:\.geojson)?$ "/mosaicjson/info";
        ~^/mosaicjson/point/ "/mosaicjson/point/{lon},{lat}";
        ~^/mosaicjson/bbox/ "/mosaicjson/bbox";
        ~^/mosaicjson/validate$ "/mosaicjson/validate";
    }

    map "$upstream_cache_status:$upstream_addr" $delivery_source {
        default nginx;
        ~^(?:HIT|STALE|UPDATING): cache;
        ~^REVALIDATED: cache_revalidated;
        ~^(?:MISS|BYPASS|EXPIRED): backend;
        ~^:.+ backend;
    }

    log_format api_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"traffic":"api",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"endpoint":"$api_endpoint",'
        '"status":"$status",'
        '"request_time":$request_time,'
        '"bytes_sent":$bytes_sent,'
        '"delivery_source":"$delivery_source",'
        '"cache_status":"$upstream_cache_status",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr"}';

    upstream titiler_backends {
        hash $titiler_hash_key consistent;

        server titiler-1:8000;
        server titiler-2:8000;
        server titiler-3:8000;
        server titiler-4:8000;
        server titiler-5:8000;
        server titiler-6:8000;
    }

    upstream grafana {
        server grafana:3000;
    }

    server {
        listen 80;
        access_log off;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/ssl/strayos.com.crt;
        ssl_certificate_key /etc/nginx/ssl/star_strayos_com.key;

        access_log /var/log/nginx/access.log api_json if=$log_api_request;

        location = /metrics {
            return 403;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/api/live/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_pass http://grafana;
        }

        location /grafana/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://grafana;
        }

        location = /cog/statistics {
            proxy_cache tiles;
            proxy_cache_key $scheme$host$uri$is_args$args;
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 12h;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_pass http://titiler_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* /tiles/ {
            proxy_cache tiles;
            proxy_cache_key $scheme$host$uri$is_args$args;
            proxy_ignore_headers Cache-Control Expires;
            proxy_cache_valid 200 12h;
            proxy_cache_use_stale error timeout updating;
            proxy_pass http://titiler_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://titiler_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
