events {
    worker_connections 2048;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $arg_url $titiler_hash_key {
        default $arg_url;
        "" $request_uri;
    }

    upstream titiler_backends {
        hash $titiler_hash_key consistent;

        server titiler-1:8000;
        server titiler-2:8000;
        server titiler-3:8000;
        server titiler-4:8000;
        server titiler-5:8000;
        server titiler-6:8000;
    }

    upstream grafana {
        server grafana:3000;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        ssl_certificate /etc/nginx/ssl/strayos.com.crt;
        ssl_certificate_key /etc/nginx/ssl/star_strayos_com.key;

        location = /metrics {
            return 403;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/api/live/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_pass http://grafana;
        }

        location /grafana/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://grafana;
        }

        location / {
            proxy_pass http://titiler_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
